<!DOCTYPE HTML>
<html lang="zh-TW">
<head>
    <title>註冊 - 校園 AI 助手</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body class="is-preload">
    <div id="page-wrapper">
        
        <!-- Centered Main Wrapper -->
        <section id="main-container">
            <div class="login-card">
                
                <!-- Registration Form -->
                <h2 class="major align-center">建立新帳號</h2>
                <form id="register-form">
                    <div class="fields">
                        <div class="field">
                            <label for="reg-name">姓名</label>
                            <input type="text" name="reg-name" id="reg-name" required />
                        </div>
                        <div class="field">
                            <label for="reg-email">Email</label>
                            <input type="email" name="reg-email" id="reg-email" required />
                        </div>
                        <div class="field">
                            <label for="reg-password">密碼</label>
                            <input type="password" name="reg-password" id="reg-password" required />
                        </div>
                    </div>
                    <ul class="actions fit">
                        <li><button type="submit" class="button primary fit">註冊</button></li>
                    </ul>
                </form>
                <p style="text-align: center; margin-top: 1.5em; font-size: 0.9em;">
                    已經有帳號了？ <a href="login.html" class="special">返回登入</a>
                </p>

            </div>
        </section>

    </div>
    <script src="js/nav-prelogin.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
