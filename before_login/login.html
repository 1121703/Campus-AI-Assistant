
<!DOCTYPE HTML>
<html lang="zh-TW">
<head>
    <title>登入 - 校園 AI 助手</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body class="is-preload">
    <div id="page-wrapper">
        
            <!-- Centered Main Wrapper -->
        <section id="main-container">
            <div class="login-card">
                
                <!-- Login Form -->
                <h2 class="major align-center">會員登入</h2>
                <form id="login-form">
                    <div class="fields">
                        <div class="field">
                            <label for="login-email">Email</label>
                            <input type="email" name="login-email" id="login-email" required />
                        </div>
                        <div class="field">
                            <label for="login-password">密碼</label>
                            <input type="password" name="login-password" id="login-password" required />
                        </div>
                    </div>
                    <ul class="actions fit">
                        <li><button type="submit" class="button primary fit">登入</button></li>
                    </ul>
                </form>
                <p style="text-align: center; margin-top: 1.5em; font-size: 0.9em;">
                    還沒有帳號？ <a href="register.html" class="special">立即註冊</a>
                </p>

            </div>
        </section>

    </div>
    <script src="js/nav-prelogin.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
