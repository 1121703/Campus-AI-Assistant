<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>行事曆 - 校園 AI 助手</title>
  <link rel="stylesheet" href="./css/calendar.css">
</head>
<body>
  <div class="app-container">
    <!-- 全寬導覽列 -->
    <nav class="app-nav">
      <div class="nav-group">
        <button class="btn view-btn active" id="btn-month-view">月</button>
        <button class="btn view-btn" id="btn-week-view">週</button>
        <button class="btn view-btn" id="btn-day-view">日</button>
      </div>
      <div class="nav-group">
        <button class="btn btn-text" id="btn-prev">◀ 上一頁</button>
        <span id="header-date">2026年5月</span>
        <button class="btn btn-text" id="btn-next">下一頁 ▶</button>
        <button class="btn btn-text" id="btn-today">今天</button>
      </div>
    </nav>

    <!-- 主容器：日曆 + 側欄 -->
    <main class="app-main" role="main">
      <div id="calendar-container" aria-live="polite"></div>
      <aside id="event-list" aria-label="任務列表"></aside>
    </main>
  </div>

  <!-- 浮動新增按鈕 -->
  <div class="fab-container" id="fab-container">
    <div class="fab-options" id="fab-options" aria-hidden="true">
      <div class="fab-option">
        <span class="fab-label">新增活動</span>
        <button class="fab-option-btn" id="btn-add-event" aria-label="新增活動">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
      </div>
      <div class="fab-option">
        <span class="fab-label">新增任務</span>
        <button class="fab-option-btn" id="btn-add-task" aria-label="新增任務">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <button class="fab-main" id="fab-main" aria-label="新增" aria-expanded="false">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>
  </div>

  <!-- 模態框（新增/編輯事件） -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-content" role="document">
      <div class="modal-header">
        <h2>新增事件</h2>
        <button class="modal-close" id="modal-close" aria-label="關閉">✕</button>
      </div>
      <div class="modal-body">
        <form id="modal-form"></form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-save" id="modal-save">儲存</button>
      </div>
    </div>
  </div>

  <!-- 共用導覽列 -->
  <script src="../dashboard/assets/js/nav.js"></script>
  <script src="../dashboard/assets/js/app-core.js"></script>
  <!-- 指令檔（認證、API、工具函數） -->
  <script src="./js/auth.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/main.js"></script>
  <script>
    (function () {
      var fab   = document.getElementById('fab-main');
      var opts  = document.getElementById('fab-options');
      var cont  = document.getElementById('fab-container');
      function openFab()  { cont.classList.add('open');    fab.setAttribute('aria-expanded','true');  opts.removeAttribute('aria-hidden'); }
      function closeFab() { cont.classList.remove('open'); fab.setAttribute('aria-expanded','false'); opts.setAttribute('aria-hidden','true'); }
      fab.addEventListener('click', function (e) {
        e.stopPropagation();
        cont.classList.contains('open') ? closeFab() : openFab();
      });
      document.addEventListener('click', function (e) {
        if (!cont.contains(e.target)) closeFab();
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeFab(); });
    }());
  </script>
</body>
</html>
